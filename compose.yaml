name: server-connector
services:
  gateway:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PUBLIC_URL: https://${GATEWAY_DOMAIN:?Set GATEWAY_DOMAIN in .env}
      LISTEN_HOST: 0.0.0.0
      PORT: 3080
      DATABASE_PATH: /app/data/connector.sqlite
      MASTER_KEY_FILE: /run/secrets/master_key
      SSH_ALLOWED_CIDRS: ${SSH_ALLOWED_CIDRS:?Set SSH_ALLOWED_CIDRS in .env}
      OAUTH_REDIRECT_URIS: ${OAUTH_REDIRECT_URIS:-https://chatgpt.com/connector_platform_oauth_redirect}
      REQUIRE_MFA: "true"
      TRUSTED_PROXY_CIDRS: ${CONNECTOR_CADDY_IP:-172.31.250.2}/32
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-4}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-60}
      OUTPUT_LIMIT_BYTES: ${OUTPUT_LIMIT_BYTES:-65536}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      OAUTH_REFRESH_IDLE_DAYS: ${OAUTH_REFRESH_IDLE_DAYS:-90}
    secrets: [master_key]
    volumes: [gateway_data:/app/data]
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    networks:
      control:
        ipv4_address: ${CONNECTOR_APP_IP:-172.31.250.3}
  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    restart: unless-stopped
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?Set GATEWAY_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    networks:
      control:
        ipv4_address: ${CONNECTOR_CADDY_IP:-172.31.250.2}
volumes:
  gateway_data:
  caddy_data:
  caddy_config:
secrets:
  master_key:
    file: ./secrets/master_key
networks:
  control:
    ipam:
      config:
        - subnet: ${CONNECTOR_SUBNET:-172.31.250.0/29}
