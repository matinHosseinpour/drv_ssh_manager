# Apply with: docker compose -f compose.yaml -f deploy/compose.nginx.yaml ...
# Start only gateway. Host Nginx owns ports 80/443; the Caddy profile stays off.
services:
  gateway:
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-3080}:3080"
    environment:
      TRUSTED_PROXY_CIDRS: ${CONNECTOR_BRIDGE_IP:-172.31.250.1}/32
